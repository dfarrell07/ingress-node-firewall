version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (io.WriteCloser).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*bufio.Writer).Flush
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1001"
