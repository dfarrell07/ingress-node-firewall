version: "2"
linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1000"
        - "-ST1001"
        - "-ST1005"
        - "-ST1019"
        - "-ST1020"
        - "-S1039"
        - "-SA4010"
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
