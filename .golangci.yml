version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters:
          - errcheck
        source: "fmt\\.Fprint"
      - linters:
          - errcheck
        source: "\\.Close\\(\\)"
      - linters:
          - staticcheck
        checks:
          - QF1001
          - QF1003
          - QF1008
          - ST1001
          - ST1005
