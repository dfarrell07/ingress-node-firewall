version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (*net.TCPListener).Close
        - (*net.TCPConn).Close
        - (io.Closer).Close
        - (*io.PipeWriter).Close
  exclusions:
    rules:
      - linters: [errcheck]
        text: "Close"
        path: "_test\\.go"
      - linters: [staticcheck]
        text: "QF1008:"
      - linters: [staticcheck]
        text: "QF1001:"
      - linters: [staticcheck]
        text: "QF1003:"
      - linters: [staticcheck]
        text: "ST1001:"
        path: "test/"
      - linters: [staticcheck]
        text: "SA1019:.*ginkgo/config"
        path: "test/"
      - linters: [staticcheck]
        text: "SA1019:.*ginkgo/types"
        path: "test/"
      - linters: [staticcheck]
        text: 'SA1019:.*ginkgo"'
        path: "test/"
      - linters: [staticcheck]
        text: "SA1019:.*admission/v1beta1"
        path: "_test\\.go"
      - linters: [staticcheck]
        text: "SA1019:.*scheme.Builder"
      - linters: [staticcheck]
        text: "SA4010:"
      - linters: [staticcheck]
        text: "S1039:"
