version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters: [errcheck]
        source: "fmt\\.Fprint"
      - linters: [errcheck]
        source: "\\.Close\\("
      - linters: [staticcheck]
        text: "SA1019: scheme.Builder is deprecated"
      - linters: [staticcheck]
        text: "ST1001"
        path: "test/"
