version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters: [staticcheck]
        text: "ST1001"
      - linters: [staticcheck]
        text: "QF1001"
      - linters: [staticcheck]
        text: "QF1003"
      - linters: [staticcheck]
        text: "QF1008"
      - linters: [staticcheck]
        text: "SA1019: scheme.Builder"
      - linters: [golint]
        text: ".*"
      - linters: [errcheck]
        text: "Close"
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
