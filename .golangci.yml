version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (io.WriteCloser).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (*crypto/tls.Conn).Close
        - (*io.PipeWriter).Close
        - (*bufio.Writer).Flush

issues:
  exclude-rules:
    - linters:
        - staticcheck
      text: "ST1001"
      path: _test\.go|test/
    - linters:
        - staticcheck
      text: "QF"
