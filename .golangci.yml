version: "2"
linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF1001"
        - "-QF1003"
        - "-QF1008"
        - "-ST1001"
        - "-ST1005"
  exclusions:
    rules:
      - linters:
          - errcheck
        source: "fmt\\.Fprint"
      - linters:
          - errcheck
        source: "\\.Close\\(\\)"
