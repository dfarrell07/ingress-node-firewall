version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - (*net.TCPListener).Close
        - (*net.TCPConn).Close
        - (io.Closer).Close
        - (net.Conn).Close
        - (*io.PipeWriter).Close
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1000"
        - "-ST1001"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"
  exclusions:
    rules:
      - path: "api/v1alpha1/groupversion_info.go"
        linters:
          - staticcheck
        text: "SA1019: scheme.Builder is deprecated"
      - linters:
          - errcheck
        text: "Close"
