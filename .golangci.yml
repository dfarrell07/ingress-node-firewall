version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters:
          - errcheck
        source: "\\.Close\\(\\)|fmt\\.Fprint|fmt\\.Fprintf"
      - linters:
          - staticcheck
        text: "ST1001:"
      - linters:
          - staticcheck
        text: "ST1005:"
      - linters:
          - staticcheck
        text: "ST1019"
      - linters:
          - staticcheck
        text: "QF1001:"
      - linters:
          - staticcheck
        text: "QF1003:"
      - linters:
          - staticcheck
        text: "QF1008:"
      - linters:
          - staticcheck
        text: "SA1019:"
