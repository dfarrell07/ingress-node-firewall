version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters: [errcheck]
        source: "fmt\\.Fprint"
      - linters: [errcheck]
        source: "\\.Close\\(\\)"
      - linters: [staticcheck]
        text: "QF1001|QF1003|QF1008|S1039|SA4010"
      - linters: [staticcheck]
        text: "ST1001"
        path: "test/"
      - linters: [staticcheck]
        text: "scheme.Builder is deprecated"
